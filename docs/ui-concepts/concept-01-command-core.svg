      <stop offset="0" stop-color="#05080a"/>
      <stop offset="0.58" stop-color="#101820"/>
      <stop offset="1" stop-color="#17120b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14252a" stop-opacity="0.94"/>
