<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="0.45" stop-color="#15191d"/>
      <stop offset="1" stop-color="#10170f"/>
    </linearGradient>
    <linearGradient id="quietPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2326" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0b0e13" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg3)"/>
  <rect x="36" y="34" width="270" height="894" rx="20" fill="#0b1014" stroke="#7ceadf" stroke-opacity="0.22"/>
  <circle cx="171" cy="132" r="62" fill="#0f2024" stroke="#7ceadf" stroke-opacity="0.58" filter="url(#softGlow)"/>
  <circle cx="171" cy="132" r="34" fill="none" stroke="#d6c48a" stroke-width="2"/>
  <text x="171" y="236" text-anchor="middle" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="24" fill="#f1f7f6">Praxis</text>
  <text x="171" y="264" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#9fb0b3">local assistant awake</text>
  <g font-family="Segoe UI, sans-serif" font-size="18">
    <rect x="68" y="332" width="206" height="48" rx="10" fill="#172024"/>
    <text x="98" y="363" fill="#f1f7f6">Today</text>
    <rect x="68" y="400" width="206" height="48" rx="10" fill="transparent"/>
    <text x="98" y="431" fill="#9fb0b3">Projects</text>
    <rect x="68" y="468" width="206" height="48" rx="10" fill="transparent"/>
    <text x="98" y="499" fill="#9fb0b3">People</text>
    <rect x="68" y="536" width="206" height="48" rx="10" fill="transparent"/>
    <text x="98" y="567" fill="#9fb0b3">Inbox</text>
  </g>
  <rect x="346" y="58" width="886" height="214" rx="18" fill="url(#quietPanel)" stroke="#7ceadf" stroke-opacity="0.28"/>
  <text x="390" y="116" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="18" fill="#d6c48a" letter-spacing="4">STATUS REPORT</text>
  <text x="390" y="168" font-family="Segoe UI, sans-serif" font-size="36" fill="#f4f8f7">Good afternoon, sir.</text>
  <text x="390" y="218" font-family="Segoe UI, sans-serif" font-size="24" fill="#d8e1e0">Your top move is to finish the sourcebook outline.</text>
  <text x="390" y="250" font-family="Segoe UI, sans-serif" font-size="16" fill="#a8b6b8">One appointment tomorrow, five active deadlines, three quick wins.</text>
  <rect x="1264" y="58" width="292" height="214" rx="18" fill="#11161a" stroke="#d6c48a" stroke-opacity="0.28"/>
  <text x="1300" y="116" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="16" fill="#d6c48a" letter-spacing="3">NOW</text>
  <text x="1300" y="166" font-family="Segoe UI, sans-serif" font-size="40" fill="#f4f8f7">2:18 PM</text>
  <text x="1300" y="214" font-family="Segoe UI, sans-serif" font-size="17" fill="#a8b6b8">Friday - April 24</text>
  <rect x="346" y="312" width="560" height="410" rx="18" fill="url(#quietPanel)" stroke="#7ceadf" stroke-opacity="0.24"/>
  <text x="390" y="368" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="17" fill="#7ceadf" letter-spacing="4">ACTIVE THREADS</text>
  <g font-family="Segoe UI, sans-serif">
    <rect x="390" y="404" width="470" height="76" rx="10" fill="#0c1116"/>
    <text x="418" y="438" font-size="20" fill="#f1f7f6">Origins 2026</text>
    <text x="418" y="466" font-size="15" fill="#a8b6b8">outline, adventure, staff coordination</text>
    <rect x="390" y="504" width="470" height="76" rx="10" fill="#0c1116"/>
    <text x="418" y="538" font-size="20" fill="#f1f7f6">DCPS Engineering</text>
    <text x="418" y="566" font-size="15" fill="#a8b6b8">report, invoice, site lighting</text>
    <rect x="390" y="604" width="470" height="76" rx="10" fill="#0c1116"/>
    <text x="418" y="638" font-size="20" fill="#f1f7f6">House / Personal</text>
    <text x="418" y="666" font-size="15" fill="#a8b6b8">bloodwork, doctor, repairs</text>
  </g>
  <rect x="946" y="312" width="610" height="410" rx="18" fill="url(#quietPanel)" stroke="#7ceadf" stroke-opacity="0.24"/>
  <text x="990" y="368" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="17" fill="#7ceadf" letter-spacing="4">CONVERSATION</text>
  <rect x="990" y="408" width="500" height="82" rx="16" fill="#0b1014" stroke="#7ceadf" stroke-opacity="0.18"/>
  <text x="1020" y="454" font-family="Segoe UI, sans-serif" font-size="21" fill="#e8efee">What can I knock out quickly?</text>
  <rect x="1038" y="520" width="452" height="118" rx="16" fill="#161f1b" stroke="#d6c48a" stroke-opacity="0.26"/>
  <text x="1068" y="564" font-family="Segoe UI, sans-serif" font-size="20" fill="#f1f7f6">Three quick wins are available.</text>
  <text x="1068" y="598" font-family="Segoe UI, sans-serif" font-size="17" fill="#a8b6b8">The fastest is calling Max about the invoice.</text>
  <rect x="990" y="772" width="566" height="86" rx="18" fill="#070b0f" stroke="#7ceadf" stroke-opacity="0.32"/>
  <text x="1024" y="825" font-family="Consolas, monospace" font-size="19" fill="#b8c7c9">Ask or dictate here...</text>
  <rect x="346" y="760" width="560" height="168" rx="18" fill="#11161a" stroke="#d6c48a" stroke-opacity="0.24"/>
  <text x="390" y="810" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="16" fill="#d6c48a" letter-spacing="3">QUIET NUDGES</text>
  <text x="390" y="854" font-family="Segoe UI, sans-serif" font-size="20" fill="#f1f7f6">Scott invoice has waited 4 days.</text>
  <text x="390" y="888" font-family="Segoe UI, sans-serif" font-size="17" fill="#a8b6b8">Praxis can remind you again tomorrow if this is not useful now.</text>
  <text x="68" y="960" font-family="Segoe UI, sans-serif" font-size="18" fill="#a8b6b8">Direction 3: Ambient Companion - calm always-on assistant, less cockpit, better for daily use and voice-first flow.</text>
</svg>
