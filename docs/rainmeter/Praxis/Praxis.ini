[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=PRAXIS Presence
Author=PRAXIS
Information=Display-only PRAXIS snapshot skin draft.
Version=0.1
License=Private operator draft

[Variables]
SnapshotPath=C:\Path\To\Praxis Project\memory\runtime\rainmeter\praxis-snapshot.json
PanelBg=18,29,29,226
Line=185,222,219,43
Text=244,239,228,255
Muted=174,182,176,255
Cyan=85,234,220,255
Gold=244,198,109,255
Red=231,131,131,255

[MeasureSnapshot]
Measure=WebParser
URL=file://#SnapshotPath#
UpdateRate=15
RegExp=(?si).*"presenceLabel":\s*"([^"]*)".*"presenceDetail":\s*"([^"]*)".*"topMoveTitle":\s*"([^"]*)".*"reviewInboxCount":\s*([0-9]+).*"overdueCount":\s*([0-9]+).*"dueTodayCount":\s*([0-9]+).*"waitingCount":\s*([0-9]+).*"nextAppointmentTitle":\s*"([^"]*)".*"serviceHealthLabel":\s*"([^"]*)".*"serviceHealthDetail":\s*"([^"]*)".*

[MeasurePresenceLabel]
Measure=WebParser
URL=[MeasureSnapshot]
StringIndex=1

[MeasurePresenceDetail]
Measure=WebParser
URL=[MeasureSnapshot]
StringIndex=2

[MeasureTopMove]
Measure=WebParser
URL=[MeasureSnapshot]
StringIndex=3

[MeasureReviewInbox]
Measure=WebParser
URL=[MeasureSnapshot]
StringIndex=4

[MeasureOverdue]
Measure=WebParser
URL=[MeasureSnapshot]
StringIndex=5

[MeasureDueToday]
Measure=WebParser
URL=[MeasureSnapshot]
StringIndex=6

[MeasureWaiting]
Measure=WebParser
URL=[MeasureSnapshot]
StringIndex=7

[MeasureNextAppointment]
Measure=WebParser
URL=[MeasureSnapshot]
StringIndex=8

[MeasureServiceLabel]
Measure=WebParser
URL=[MeasureSnapshot]
StringIndex=9

[MeasureServiceDetail]
Measure=WebParser
URL=[MeasureSnapshot]
StringIndex=10

[Panel]
Meter=Shape
Shape=Rectangle 0,0,360,230,8 | Fill Color #PanelBg# | StrokeWidth 1 | Stroke Color #Line#

[Title]
Meter=String
MeasureName=MeasurePresenceLabel
X=18
Y=16
W=324
H=24
FontFace=Segoe UI
FontSize=13
FontWeight=700
FontColor=#Text#
AntiAlias=1
ClipString=1

[PresenceDetail]
Meter=String
MeasureName=MeasurePresenceDetail
X=18
Y=42
W=324
H=32
FontFace=Segoe UI
FontSize=9
FontColor=#Muted#
AntiAlias=1
ClipString=2

[TopMoveLabel]
Meter=String
Text=TOP MOVE
X=18
Y=82
W=324
H=16
FontFace=Segoe UI
FontSize=8
FontWeight=700
FontColor=#Cyan#
AntiAlias=1

[TopMove]
Meter=String
MeasureName=MeasureTopMove
X=18
Y=100
W=324
H=34
FontFace=Segoe UI
FontSize=11
FontColor=#Text#
AntiAlias=1
ClipString=2

[Counts]
Meter=String
MeasureName=MeasureReviewInbox
MeasureName2=MeasureOverdue
MeasureName3=MeasureDueToday
MeasureName4=MeasureWaiting
Text=Inbox %1   Overdue %2   Today %3   Waiting %4
X=18
Y=144
W=324
H=20
FontFace=Segoe UI
FontSize=9
FontColor=#Gold#
AntiAlias=1
ClipString=1

[NextAppointment]
Meter=String
MeasureName=MeasureNextAppointment
Text=Next: %1
X=18
Y=172
W=324
H=18
FontFace=Segoe UI
FontSize=9
FontColor=#Muted#
AntiAlias=1
ClipString=1

[ServiceHealth]
Meter=String
MeasureName=MeasureServiceLabel
MeasureName2=MeasureServiceDetail
Text=%1 - %2
X=18
Y=198
W=324
H=18
FontFace=Segoe UI
FontSize=9
FontColor=#Red#
AntiAlias=1
ClipString=1

